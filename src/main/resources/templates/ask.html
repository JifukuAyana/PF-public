<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせフォーム</title>
 <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/ask.css">
</head>
<body class="sidebar-open">
	
	<div th:replace="~{sidebar :: sidebar}"></div>
	<div th:replace="common/messageIcon :: messageIcon"></div>
	
	
  <div class="form-container">
    <h1>お問い合わせフォーム</h1>
	
	<div th:if="${message}" class="success" th:text="${message}"></div>
	<div th:if="${error}" class="error" th:text="${error}"></div>

	<form id="contactForm" th:action="@{/ask}" th:object="${askForm}" method="post">
		<div class="form-group">
			<select id="category" name="category" th:field="*{category}" required>
			  <option value="">選択してください</option>
			  <option th:each="cat : ${categoryList}" th:value="${cat.name}" th:text="${cat.name}"></option>
			</select>
	  </div>

	  <div class="form-group">
	    <label for="subject">件名</label>
	    <input type="text" id="subject" th:field="*{subject}" placeholder="件名を入力してください" required>
	  </div>

	  <div class="form-group">
	    <label for="message">本文</label>
	    <textarea id="message" th:field="*{message}" placeholder="お問い合わせ内容を入力してください" required></textarea>
	  </div>

	  <button type="submit">送信</button>
	</form>
	
  </div>

  <script src="js/sidebar.js"></script>
  
</body>
</html>
